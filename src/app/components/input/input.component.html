<input
	#inputRef
	*ngIf="!textarea() else textareaTemplate;"
	[attr.type]="type()"
	[attr.inputmode]="inputmode()"
	[placeholder]="placeholder()"
	[autocomplete]="autocomplete()"
	[autofocus]="autofocus()"
	class="control__input"
	[(ngModel)]="value"
	(input)="onInput($event)"
	[disabled]="isDisabledState()"
	[attr.name]="formControlName() || name() || null"
	[mask]="mask"
	[suffix]="suffix"
	[prefix]="prefix"
	[patterns]="patterns"
	[validation]="validation"
	[allowNegativeNumbers]="allowNegativeNumbers"
	[attr.maxlength]="maxlength() || null"
	[attr.min]="min() || null"
	[attr.max]="max() || null"
	(focus)="focusHandler($event)"
	(blur)="blurHandler($event)"
	(keydown)="keydownHandler($event)"
>
<div
	*ngIf="icon() || (clearButton() && valueStr.length) || showPasswordButton()"
	class="control__addon"
>
	<svg
		app-svg
		*ngIf="(icon() && !clearButton()) || (icon() && !valueStr.length)"
		[name]="icon()"
		class="control__icon"
	></svg>
	<button
		app-button
		*ngIf="clearButton() && valueStr.length"
		mode="negative"
		icon="cross"
		[attr.title]="clearButtonTitle() || null"
		(click)="resetValue()"
	></button>
	<button
		app-button
		*ngIf="showPasswordButton()"
		mode="positive"
		[icon]="showPasswordIcon"
		[attr.title]="showPasswordTitle || null"
		(click)="showPassword()"
	></button>
</div>
<ng-template #textareaTemplate>
	<textarea
		[placeholder]="placeholder()"
		class="control__textarea"
		[disabled]="isDisabledState()"
		(input)="onInput($event)"
		[attr.name]="formControlName() || null"
		[rows]="textareaRows()"
	>{{ valueStr }}</textarea>
</ng-template>
